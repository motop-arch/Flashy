</style></head><body><div id="app"></div><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

/* ---- import parsing ---- */
const AL={zh:['chinese','zh','hanzi','word','sentence','front','question','中文','汉字'],py:['pinyin','py','拼音'],en:['english','en','translation','meaning','back','answer'],en2:['translation2','additionaltranslation','additional','en2','other'],def:['explanation','definition','def'],ex:['example','examplesentence','ex'],ext:['exampletranslation','examplesentencetranslation','exen','ext'],img:['image','img','picture'],aud:['audio','aud','sound'],note:['notes','note'],gram:['grammar','grammarpattern','pattern'],cat:['category','topic','cat','tag']};

function csv(t,d){const rows=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==d){r.push(f);f=''}else if(c=='\n'){r.push(f);rows.push(r);r=[];f=''}else if(c!='\r')f+=c}if(f||r.length){r.push(f);rows.push(r)}return rows.filter(r=>r.some(x=>x.trim()))}

else{const first=txt.split(/\r?\n/).find(l=>l.trim())||'';const d=ext=='csv'?',':first.includes('\t')?'\t':first.includes('|')?'|':first.includes(',')?',':'\u0001';

(L.length?L.map(d=>{const s=stats(by[d.id]||[]);return`<div class="card tap" data-a="open" data-id="${d.id}"><b>${esc(d.name)}</b><div class="mu">${s.n} cards · ${s.done} completed · ${d.last?'Last studied '+new Date(d.last).toLocaleDateString():'Not studied yet'}</div><div class="bar"><i style="width:${s.pct}%"></i></div></div>`}).join(''):`<div class="card mu">${ds.length?'No decks match.':'No decks yet. Tap “Import file” to add your first CSV, TXT or JSON.'}</div>`)},

return hdr(d.name)+`<div class="card"><div class="mu">${s.n} cards · ${s.done} completed · ${s.due} due</div><div class="bar"><i style="width:${s.pct}%"></i></div></div>

async edit(){const c=V.c||{};const f=(k,l,t)=>`<label class="mu">${l}</label>${t?`<textarea id="e_${k}" style="font-size:16px">${esc(c[k]||'')}</textarea>`:`<input id="e_${k}" value="${esc(c[k]||'')}">`}`;
return hdr(V.cid?'Edit card':'New card')+`<div class="card">${f('zh','Chinese *')}${f('py','Pinyin (tone marks)')}${f('en','English translation')}${f('en2','Additional translation')}${f('def','Explanation / definition',1)}${f('ex','Example sentence',1)}${f('ext','Example translation',1)}${f('gram','Grammar pattern')}${f('cat','Category / topic')}${f('note','Notes',1)}
<label class="mu">Image ${c.img?'(attached)':''}</label><input type="file" id="e_img" accept="image/*"><label class="mu">Audio ${c.aud?'(attached)':''}</label><input type="file" id="e_aud" accept="audio/*">${c.img||c.aud?'<label><input type="checkbox" id="e_rm" style="width:auto"> Remove current image/audio</label>':''}<div id="er"></div></div><div class="row"><button class="btn" data-a="up">Cancel</button><button class="btn p" data-a="savecard">Save</button></div>`},
async settings(){const c=cfg();return hdr('Settings')+`<div class="card"><h2>Theme</h2><select id="th"><option value="system">System</option><option value="light" ${c.theme=='light'?'selected':''}>Light</option><option value="dark" ${c.theme=='dark'?'selected':''}>Dark</option></select>
<h2>Repetition intervals</h2><div class="mu">Steps used by Again → 1st, then each Good moves one step up (Easy two). Examples: 10m, 1d, 3d</div><input id="iv" value="${c.iv.map(fmt).join(', ')}"><label><input type="checkbox" id="ip" style="width:auto" ${c.ip?'checked':''}> Ignore punctuation when checking typed answers</label><button class="btn p" data-a="saveset" style="width:100%;margin-top:8px">Save settings</button><div id="er"></div></div>

async study(){const S=V,n=S.queue.length;if(!n)return hdr(S.title)+`<div class="card">Nothing due in this deck right now.</div><div class="row"><button class="btn p" data-a="study" data-id="${S.deck}" data-m="all">Study all cards</button></div>`;
if(S.done)return hdr(S.title)+`<div class="card" style="text-align:center"><h1>🎉 Deck finished</h1><div class="mu">${n} cards reviewed</div></div><div class="row"><button class="btn p" data-a="restart">Restart</button><button class="btn" data-a="up">Back to deck</button></div>`;

if(S.shown&&S.ans&&tgt){const nm=s=>{s=s.replace(/\s+/g,'').toLowerCase();return cfg().ip?s.replace(/[\p{P}\p{S}]/gu,''):s},a=nm(S.ans);const okk=tgt.split(/[;；\/／]/).some(t=>nm(t)==a||nm(t)==a);res=`<div class="${okk?'ok':'bad'}">${okk?'✓ Correct':'✗ Not quite — compare:'} <b>${esc(tgt)}</b></div>`}

<div class="row">${[['Again',0],['Difficult',1],['Good',2],['Easy',3]].map(([l,r])=>`<button class="btn ${r==2?'p':''}" data-a="rate" data-r="${r}">${l}<div class="mu" style="font-size:11px;color:inherit;opacity:.7">${fmt(ivl(c,r))}</div></button>`).join('')}</div>`}

<div class="row"><button class="btn" data-a="prev" ${S.i==0?'disabled':''}>← Previous</button><button class="btn" data-a="next" ${S.i>=n-1?'disabled':''}>Next →</button></div>`}};
/* ---- actions ---- */

const A={up,settings:()=>go('settings'),imp:()=>go('imp'),open:t=>go('deck',{id:t.dataset.id}),reimp:t=>go('imp',{rep:t.dataset.id}),
async study(t){const d=(await all('decks')).find(x=>x.id==t.dataset.id),now=Date.now();let cs=(await cardsOf(d.id)).sort((a,b)=>a.order-b.order);if(t.dataset.m=='due')cs=cs.filter(c=>c.step<0||c.due<=now);if(t.dataset.sh)shuffle(cs);V={n:'study',deck:d.id,title:d.name,mode:t.dataset.m,queue:cs,i:0,shown:false,ans:'',rev:V.rev};history.pushState(0,'');render()},

async savecard(){try{const zh=$('#e_zh').value.trim();if(!zh)throw Error('The Chinese field is required.');const old=V.c||{},c=old.id?old:{id:uid(),deck:V.deck,order:Date.now(),step:-1,due:0,hist:[]};

if($('#e_rm')?.checked){delete c.img;delete c.aud}for(const k of['img','aud']){const f=$('#e_'+k).files[0];if(f)c[k]=f}await put('cards',c);up()}catch(e){err(e)}},
async confirm(){const I=V.imp;I.name=$('#nm').value.trim()||I.name;try{const id=V.rep||uid();let created=Date.now();if(V.rep){created=(await all('decks')).find(d=>d.id==id)?.created||created;for(const c of await cardsOf(id))await del('cards',c.id)}

async rate(t){const c=V.queue[V.i],r=+t.dataset.r,iv=ivl(c,r);c.hist=(c.hist||[]).concat({t:Date.now(),r}).slice(-200);c.step=nextStep(c,r);c.due=Date.now()+iv*60000;await put('cards',c);const d=(await all('decks')).find(x=>x.id==V.deck);d.last=Date.now();await put('decks',d);
if(V.i>=V.queue.length-1)V.done=true;else{V.i++}V.shown=false;V.ans='';render()},
saveset(){try{const c=cfg();c.theme=$('#th').value;c.iv=parseIv($('#iv').value);if(!c.iv.length)throw Error('Enter at least one interval.');c.ip=$('#ip').checked;saveCfg(c);theme();$('#er').innerHTML='<div class="ok">Saved ✓</div>'}catch(e){err(e)}},
async backup(){const out={v:1,decks:await all('decks'),cards:[]};for(const c of await all('cards')){const x={...c};for(const k of['img','aud'])if(x[k] instanceof Blob)x[k]=await blobData(x[k]);out.cards.push(x)}await saveFile('flashcards-backup-'+new Date().toISOString().slice(0,10)+'.json',new Blob([JSON.stringify(out)],{type:'application/json'}))},
async export(t){const d=(await all('decks')).find(x=>x.id==t.dataset.id),out={v:1,decks:[d],cards:[]};for(const c of await cardsOf(d.id)){const x={...c};for(const k of['img','aud'])if(x[k] instanceof Blob)x[k]=await blobData(x[k]);out.cards.push(x)}await saveFile(d.name.replace(/[^\w\u4e00-\u9fa5-]+/g,'_')+'.json',new Blob([JSON.stringify(out)],{type:'application/json'}))}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&!t.disabled)Promise.resolve(A[t.dataset.a](t)).catch(x=>alert(x.message))});
document.addEventListener('input',e=>{if(e.target.id=='ans')V.ans=e.target.value;if(e.target.id=='q'){V.q=e.target.value;render().then(()=>{const i=$('#q');i.focus();i.setSelectionRange(i.value.length,i.value.length)})}});
document.addEventListener('change',async e=>{const i=e.target;if(i.id=='so'){V.s=i.value;render()}
if(i.id=='f'){const fs=[...i.files],tf=fs.find(f=>/\.(csv|txt|json)$/i.test(f.name));V.err='';try{if(!tf)throw Error('Please select a .csv, .txt or .json file.');const media={};fs.filter(f=>f!==tf).forEach(f=>media[f.name.toLowerCase()]=f);const p=parseText(await tf.text(),tf.name);V.imp={...p,media};if(V.rep){const d=(await all('decks')).find(x=>x.id==V.rep);p.name=d.name}}catch(x){V.err=x.message}render()}
if(i.id=='rs'&&i.files[0]){try{const j=JSON.parse((await i.files[0].text()).replace(/^\uFEFF/,''));if(!j.decks||!j.cards)throw Error('This is not a flashcards backup file.');if(!confirm('Restore '+j.decks.length+' deck(s) and '+j.cards.length+' cards? Matching decks will be overwritten.'))return;
for(const d of j.decks)await put('decks',d);for(const c of j.cards){for(const k of['img','aud'])if(typeof c[k]=='string'&&c[k].startsWith('data:'))c[k]=await dataBlob(c[k]);await put('cards',c)}alert('Restore complete.');V={n:'home'};render()}catch(x){alert('Restore failed: '+x.message)}}});
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',theme);
navigator.storage?.persist?.();render();
</script></body></html>
